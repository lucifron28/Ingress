name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests (PHP 8.4)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer Dependencies
        working-directory: api
        run: composer audit --locked

      - name: Prepare Environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend Tests
        working-directory: api
        run: php artisan test

  postgres-concurrency:
    name: PostgreSQL Concurrency Verification
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Install Composer Dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        working-directory: api
        run: |
          cp .env.example .env
          sed -i 's/DB_PORT=5433/DB_PORT=5432/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          php artisan key:generate

      - name: Run PostgreSQL Concurrency Verifier
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: php scripts/verify_pgsql_concurrency.php

      - name: Run PostgreSQL Load and Recovery Verification
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: password
          INGRESS_LOAD_DB: ingress_load_recovery
          INGRESS_LOAD_ATTENDEES: 1000
          INGRESS_LOAD_WORKERS: 4
        run: php scripts/verify_load_recovery.php

  mobile-tests:
    name: Mobile Tests & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Audit Mobile Dependencies
        working-directory: mobile
        run: npm audit

      - name: Run Mobile Session & Storage Tests
        working-directory: mobile
        run: node tests/session.test.mjs

      - name: Verify Mobile Build Configuration
        working-directory: mobile
        run: node --test tests/build-config.test.mjs

      - name: Verify Mobile TypeScript Compilation
        working-directory: mobile
        run: npx tsc --noEmit
