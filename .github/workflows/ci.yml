name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-node-manager:
    name: Windows Node Manager
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run PowerShell apply confirmation regressions
        shell: powershell
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version -eq [version]'3.4.0' })) {
            Install-Module -Name Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $result = Invoke-Pester -Script scripts/tests/IngressNetworkManager.ConfirmApply.Tests.ps1 -PassThru
          if ($result.PassedCount -lt 1 -or $result.FailedCount -ne 0) {
            throw 'PowerShell apply confirmation regression tests failed.'
          }

      - name: Run Node Manager tests
        run: dotnet test tools/Ingress.NodeManager/Ingress.NodeManager.slnx --configuration Release

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:RUNNER_TEMP 'IngressNodeManager'
          $publishArguments = @(
            'tools/Ingress.NodeManager/Ingress.NodeManager/Ingress.NodeManager.csproj',
            '--configuration', 'Release',
            '--runtime', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:EnableCompressionInSingleFile=true',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '--output', $publishPath
          )
          dotnet publish @publishArguments
          if (-not (Test-Path (Join-Path $publishPath 'Ingress.NodeManager.exe'))) {
            throw 'The Windows x64 executable was not published.'
          }
          if (-not (Test-Path (Join-Path $publishPath 'scripts/IngressNetworkManager.psm1'))) {
            throw 'The packaged PowerShell Network Manager module is missing.'
          }

  backend-tests:
    name: Backend Tests (PHP 8.4)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit Composer Dependencies
        working-directory: api
        run: composer audit --locked

      - name: Prepare Environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend Tests
        working-directory: api
        run: php artisan test

  backend-php85:
    name: Backend Compatibility Tests (PHP 8.5)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, sodium, xmlwriter
          coverage: none

      - name: Install Composer Dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend Compatibility Tests
        working-directory: api
        run: php artisan test

  postgres-concurrency:
    name: PostgreSQL Concurrency Verification
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Install Composer Dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        working-directory: api
        run: |
          cp .env.example .env
          sed -i 's/DB_PORT=5433/DB_PORT=5432/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=password/' .env
          php artisan key:generate

      - name: Run PostgreSQL Concurrency Verifier
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: password
        run: php scripts/verify_pgsql_concurrency.php

      - name: Run PostgreSQL Load and Recovery Verification
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: password
          INGRESS_LOAD_DB: ingress_load_recovery
          INGRESS_LOAD_ATTENDEES: 1000
          INGRESS_LOAD_WORKERS: 4
        run: php scripts/verify_load_recovery.php

      - name: Verify Render migration lock contention
        working-directory: api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
          DB_USERNAME: postgres
          DB_PASSWORD: password
          DB_SSLMODE: disable
        run: |
          php scripts/verify_render_migration_lock.php

  mobile-tests:
    name: Mobile Tests & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Audit Mobile Dependencies
        working-directory: mobile
        run: npm audit

      - name: Lint Mobile App
        working-directory: mobile
        run: npx expo lint

      - name: Run Mobile Node Session Security Tests
        working-directory: mobile
        run: node tests/session.test.mjs

      - name: Run Mobile Scanner-Only Tests
        working-directory: mobile
        run: node --test tests/scanner-only.test.mjs

      - name: Verify Mobile Build Configuration
        working-directory: mobile
        run: node --test tests/build-config.test.mjs

      - name: Verify Mobile TypeScript Compilation
        working-directory: mobile
        run: npx tsc --noEmit

  render-docker:
    name: Render Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Render image
        working-directory: api
        run: docker build --tag ingress-cloud:ci .

      - name: Verify PHP extensions and server configuration
        run: |
          docker run --rm --entrypoint php ingress-cloud:ci -r '$required = ["mbstring", "pdo_pgsql", "sodium", "xmlwriter"]; $missing = array_diff($required, get_loaded_extensions()); if ($missing) { fwrite(STDERR, "Missing PHP extensions: ".implode(", ", $missing).PHP_EOL); exit(1); } echo "Required PHP extensions are loaded.".PHP_EOL;'
          docker run --rm -e PORT=10000 --entrypoint /bin/sh ingress-cloud:ci -ec '
            envsubst "\$PORT" < /var/www/html/docker/nginx.conf.template > /tmp/nginx.conf
            nginx -e stderr -t -c /tmp/nginx.conf
            php-fpm -t -y /var/www/html/docker/php-fpm.conf
            set +e
            timeout -s TERM 3 supervisord -n -c /var/www/html/docker/supervisord.conf
            status=$?
            set -e
            test "$status" -eq 0 -o "$status" -eq 124 -o "$status" -eq 143
          '

      - name: Verify Nginx recreates missing temporary directories and binds Render PORT
        working-directory: api
        run: |
          docker run --rm -e PORT=10000 \
            --mount "type=bind,source=$PWD/tests/docker/nginx-startup.sh,target=/tmp/nginx-startup.sh,readonly" \
            --entrypoint /bin/sh ingress-cloud:ci /tmp/nginx-startup.sh

      - name: Verify WSL Nginx configuration syntax
        run: |
          mkdir -p "$RUNNER_TEMP/ingress-certs"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/ingress-certs/privkey.pem" -out "$RUNNER_TEMP/ingress-certs/fullchain.pem" -subj "/CN=node-1.example.edu" -days 1
          sed \
            -e 's|/etc/ssl/ingress-node/fullchain.pem|/tmp/ingress-certs/fullchain.pem|' \
            -e 's|/etc/ssl/ingress-node/privkey.pem|/tmp/ingress-certs/privkey.pem|' \
            api/deploy/wsl/nginx/ingress-node.conf > "$RUNNER_TEMP/ingress-nginx.conf"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/ingress-nginx.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/ingress-certs,target=/tmp/ingress-certs,readonly" \
            nginx:1.28-alpine nginx -t
          docker run --detach --name ingress-wsl-nginx-ci \
            --publish 127.0.0.1:18443:443 \
            --mount "type=bind,source=$RUNNER_TEMP/ingress-nginx.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/ingress-certs,target=/tmp/ingress-certs,readonly" \
            nginx:1.28-alpine
          cleanup() {
            docker logs ingress-wsl-nginx-ci
            docker rm --force ingress-wsl-nginx-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          status=''
          for attempt in $(seq 1 10); do
            status=$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}' --resolve node-1.example.edu:18443:127.0.0.1 --path-as-is https://node-1.example.edu:18443/.env || true)
            if [ "$status" = '403' ]; then
              break
            fi
            sleep 1
          done
          test "$status" = '403'
          if curl --insecure --silent --fail --output /dev/null https://127.0.0.1:18443/.env; then
            echo 'Nginx accepted a request with an unknown TLS host.' >&2
            exit 1
          fi

  event-node-docker:
    name: Event Node Docker Integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build and verify the isolated Event Node Docker Compose profile
        run: bash api/tests/docker/node-compose.sh
