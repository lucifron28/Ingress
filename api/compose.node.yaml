name: ingress-node

services:
  ingress-db:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ingress_node}
      POSTGRES_USER: ${DB_USERNAME:-ingress_node}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - db_password
    volumes:
      - ingress_node_database:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=0775
      - /tmp:rw,noexec,nosuid,size=64m,uid=70,gid=70,mode=1777
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  ingress-migrate:
    image: ${INGRESS_NODE_IMAGE:-ingress-node:compose}
    build:
      context: .
      dockerfile: Dockerfile.node
    command: ["migrate"]
    environment: &node_environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL in .env.node}
      APP_MAINTENANCE_DRIVER: cache
      APP_MAINTENANCE_STORE: database
      APP_KEY_FILE: /run/secrets/app_key
      INGRESS_RUNTIME: node
      INGRESS_DEMO_MODE: "false"
      INGRESS_NODE_ID: ${INGRESS_NODE_ID:?Set INGRESS_NODE_ID in .env.node}
      INGRESS_NODE_SYNC_KEY_FILE: /run/secrets/node_sync_key
      INGRESS_CLOUD_SYNC_URL: ${INGRESS_CLOUD_SYNC_URL:?Set INGRESS_CLOUD_SYNC_URL in .env.node}
      INGRESS_AUTHORITY_PUBLIC_KEY: ${INGRESS_AUTHORITY_PUBLIC_KEY:?Set INGRESS_AUTHORITY_PUBLIC_KEY in .env.node}
      INGRESS_AUTHORITY_PRIVATE_KEY: ""
      INGRESS_OPERATOR_GATEWAY: ${INGRESS_EGRESS_GATEWAY:-172.29.241.1}
      INGRESS_OPERATOR_ALLOWED_CIDRS: "${INGRESS_EGRESS_GATEWAY:-172.29.241.1}/32"
      TRUSTED_PROXIES: ""
      DB_CONNECTION: pgsql
      DB_URL: ""
      DB_HOST: ingress-db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-ingress_node}
      DB_USERNAME: ${DB_USERNAME:-ingress_node}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSLMODE: disable
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: strict
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
    secrets:
      - app_key
      - db_password
      - node_sync_key
    networks:
      - egress
      - data
    depends_on:
      ingress-db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    read_only: true
    tmpfs: &app_tmpfs
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=1770
      - /app/storage:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0750
      - /app/bootstrap/cache:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ingress-node:
    image: ${INGRESS_NODE_IMAGE:-ingress-node:compose}
    build:
      context: .
      dockerfile: Dockerfile.node
    command: ["serve"]
    environment:
      <<: *node_environment
      PORT: "8443"
    secrets:
      - app_key
      - db_password
      - node_sync_key
      - node_tls_certificate
      - node_tls_private_key
    ports:
      - "${INGRESS_NODE_BIND_ADDRESS:?Set INGRESS_NODE_BIND_ADDRESS to the Windows LAN IPv4 address}:${INGRESS_NODE_HTTPS_PORT:-443}:8443"
      - "127.0.0.1:${INGRESS_OPERATOR_PORT:-8444}:8444"
    networks:
      egress:
        gw_priority: 1
      data: {}
    depends_on:
      ingress-db:
        condition: service_healthy
      ingress-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: *app_tmpfs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ingress-scheduler:
    image: ${INGRESS_NODE_IMAGE:-ingress-node:compose}
    build:
      context: .
      dockerfile: Dockerfile.node
    command: ["scheduler"]
    environment: *node_environment
    secrets:
      - app_key
      - db_password
      - node_sync_key
    networks:
      - egress
      - data
    depends_on:
      ingress-db:
        condition: service_healthy
      ingress-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: *app_tmpfs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ingress-cli:
    image: ${INGRESS_NODE_IMAGE:-ingress-node:compose}
    build:
      context: .
      dockerfile: Dockerfile.node
    entrypoint: ["/usr/local/bin/node-entrypoint", "cli"]
    command: ["ingress:node-operator:create"]
    profiles: ["maintenance"]
    environment: *node_environment
    secrets:
      - app_key
      - db_password
      - node_sync_key
    networks:
      - egress
      - data
    depends_on:
      ingress-db:
        condition: service_healthy
      ingress-migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: "no"
    read_only: true
    tmpfs: *app_tmpfs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ingress_node_database:

networks:
  egress:
    ipam:
      config:
        - subnet: ${INGRESS_EGRESS_SUBNET:-172.29.241.0/28}
          gateway: ${INGRESS_EGRESS_GATEWAY:-172.29.241.1}
  data:
    internal: true

secrets:
  app_key:
    file: ${NODE_SECRETS_DIR:-./.secrets}/app_key
  db_password:
    file: ${NODE_SECRETS_DIR:-./.secrets}/db_password
  node_sync_key:
    file: ${NODE_SECRETS_DIR:-./.secrets}/node_sync_key
  node_tls_certificate:
    file: ${NODE_SECRETS_DIR:-./.secrets}/node_tls_certificate
  node_tls_private_key:
    file: ${NODE_SECRETS_DIR:-./.secrets}/node_tls_private_key
