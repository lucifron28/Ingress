server {
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name node-1.example.edu;

    root /srv/ingress/api/public;
    index index.php;
    server_tokens off;
    client_max_body_size 32m;

    ssl_certificate /etc/ssl/ingress-node/fullchain.pem;
    ssl_certificate_key /etc/ssl/ingress-node/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IngressNodeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* ^/(?:\.env|\.git|vendor|storage|bootstrap/cache)(?:/|$) {
        deny all;
    }

    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 90s;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
